# Project:  PeerFoil  |  File: .github/workflows/ci.yml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-09-04  |  Modified: 2026-09-05
# Summary:  Checks PeerFoil's documentation, repository rules, and plugin manifests on Linux, macOS, and Windows.
# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        shell: bash
        run: bash .github/scripts/conformance.sh

  plugin-validate:
    name: plugin validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the tested Claude Code version
        shell: bash
        run: npm install -g @anthropic-ai/claude-code@2.1.260
      - name: Validate the marketplace and plugin manifests strictly
        shell: bash
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/peerfoil
