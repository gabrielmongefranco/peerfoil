# Project:  PeerFoil  |  File: .github/workflows/ci.yml
# Authors:  Gabriel Mongefranco (@gabrielmongefranco)
# Created:  2026-09-04  |  Modified: 2026-10-21
# Summary:  Checks PeerFoil's documentation, repository rules, plugin manifests, and fixtures on Linux, macOS, and Windows.
# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Check repository files
        shell: bash
        run: bash .github/scripts/conformance.sh

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal embed.go)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed in:" "$unformatted"
            exit 1
          fi
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Build
        shell: bash
        run: go build ./...
      - name: Test with race detection where supported
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ] || [ "$RUNNER_OS" = "macOS" ]; then
            go test -race ./...
          else
            go test ./...
          fi

  fixtures:
    name: fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test the Go fixture
        shell: bash
        working-directory: fixtures/software-go
        run: |
          go vet ./...
          go test ./...
      - name: Test the Node.js fixture
        shell: bash
        working-directory: fixtures/software-node
        run: node --test

  plugin-validate:
    name: plugin validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the tested Claude Code version
        shell: bash
        run: npm install -g @anthropic-ai/claude-code@2.1.260
      - name: Validate the marketplace and plugin manifests strictly
        shell: bash
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict plugins/peerfoil
