<title id="title">PeerFoil workflow</title><desc id="desc">Reviewed plan, produce, validate, independent review, then approve or repair. Failures return to production; repairs return to checks and fresh review. Pause for user decisions and limits.</desc>
<rect width="480" height="880" fill="#0B203F"/><text x="240" y="43" font-family="Arial, DejaVu Sans, sans-serif" font-size="25" font-weight="600" fill="#FAFAF7" text-anchor="middle">The peer-review loop</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BCD0E3"/></marker></defs><rect x="40" y="76" width="400" height="90" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="240" y="107" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Define → Architect → Plan</text><text x="240" y="131" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Independent review + your approval</text><rect x="130" y="213" width="260" height="69" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="260" y="244" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Produce</text><text x="260" y="268" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">One task at a time</text><rect x="130" y="339" width="260" height="69" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="260" y="370" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Validate</text><text x="260" y="394" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Check the exact revision</text><rect x="130" y="468" width="260" height="80" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="260" y="499" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Independent review</text><text x="260" y="523" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Compare findings</text><rect x="30" y="632" width="195" height="72" rx="12" fill="#142F50" stroke="#FF7E6D" stroke-width="2"/><text x="127.5" y="663" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Repair</text><text x="127.5" y="687" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">One automatic cycle</text><rect x="260" y="632" width="190" height="72" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="355" y="663" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Approve</text><text x="355" y="687" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">No blockers</text><path d="M260 166 V213" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260 282 V339" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260 408 V468" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M390 373 H451 V246 H390" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="421" y="317" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#FF7E6D" text-anchor="middle">Fail</text><text x="292" y="447" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62E5A4" text-anchor="start">Pass</text><path d="M200 548 V590 H127 V632" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="151" y="581" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#FF7E6D" text-anchor="start">Fix</text><path d="M322 548 V590 H355 V632" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="393" y="580" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#62E5A4" text-anchor="middle">Approved</text><path d="M30 665 H16 V373 H130" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="240" y="758" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FAFAF7" text-anchor="middle">Repairs get fresh checks and review.</text><text x="240" y="793" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FAFAF7" text-anchor="middle">No agent approves its own work.</text><text x="240" y="840" font-family="Arial, DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#BCD0E3" text-anchor="middle">Pause for decisions, permissions or limits.</text>
</svg>
