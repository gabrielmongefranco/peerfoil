<title id="title">PeerFoil workflow and bounded repair loop</title><desc id="desc">Define, architect and plan with independent review and user approval. Produce one task, validate it, and obtain independent review. Failed checks return to production. Accepted repairs return through validation and fresh review. Approve only with no blocking findings. Pause for user decisions, permissions and limits.</desc>
<rect width="900" height="810" fill="#0B203F"/><text x="450" y="47" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="600" fill="#FAFAF7" text-anchor="middle">From idea to independently reviewed work</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BCD0E3"/></marker></defs><rect x="100" y="80" width="700" height="72" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="450" y="111" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Define → Architect → Plan</text><text x="450" y="135" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Architecture and plan independently reviewed; you approve the order.</text><rect x="320" y="191" width="260" height="69" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="450" y="222" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Produce</text><text x="450" y="246" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">One bounded task at a time</text><rect x="320" y="303" width="260" height="69" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="450" y="334" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Validate</text><text x="450" y="358" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Check the exact revision</text><rect x="320" y="423" width="260" height="84" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="450" y="454" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Independent review</text><text x="450" y="478" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">Reviewers compare findings</text><rect x="320" y="566" width="260" height="69" rx="12" fill="#142F50" stroke="#62E5A4" stroke-width="2"/><text x="450" y="597" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Approve</text><text x="450" y="621" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">No blocking findings remain</text><rect x="626" y="429" width="230" height="78" rx="12" fill="#142F50" stroke="#FF7E6D" stroke-width="2"/><text x="741" y="460" font-family="Arial, DejaVu Sans, sans-serif" font-size="21" font-weight="600" fill="#FAFAF7" text-anchor="middle">Repair</text><text x="741" y="484" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#BCD0E3" text-anchor="middle">One automatic cycle</text><path d="M450 152 V191" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M450 260 V303" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M450 372 V423" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M450 507 V566" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M320 338 H186 V224 H320" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="176" y="282" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#FF7E6D" text-anchor="middle">Fail: correct work</text><path d="M580 465 H626" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="603" y="451" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#FF7E6D" text-anchor="middle">Fix</text><path d="M741 429 V338 H580" fill="none" stroke="#BCD0E3" stroke-width="2.5" marker-end="url(#arrow)"/><text x="726" y="318" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#BCD0E3" text-anchor="middle">Rerun checks</text><text x="478" y="403" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#62E5A4" text-anchor="start">Pass</text><text x="475" y="543" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#62E5A4" text-anchor="start">Approved</text><text x="450" y="686" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FAFAF7" text-anchor="middle">Repairs return through validation and fresh independent review.</text><text x="450" y="719" font-family="Arial, DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#FAFAF7" text-anchor="middle">An agent never approves its own work.</text><text x="450" y="759" font-family="Arial, DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#BCD0E3" text-anchor="middle">Pause for your decision when blocked, permission is needed, or limits are reached.</text>
</svg>
